name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same engine and extension as development and Neon.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: batas
          POSTGRES_USER: batas
          POSTGRES_PASSWORD: batas-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U batas -d batas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: batas
      POSTGRES_USER: batas
      POSTGRES_PASSWORD: batas-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (includes the retrieval quality gate)
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Retrieval report
        run: |
          python manage.py migrate --noinput
          python manage.py load_corpus
          python manage.py eval_retrieval
          python manage.py eval_retrieval --set heldout
      - name: Deploy checks
        env:
          DJANGO_HTTPS: "true"
          DJANGO_ALLOWED_HOSTS: batas-ph.onrender.com
          DJANGO_SECRET_KEY: ci-only-not-secret-but-long-enough-for-the-deploy-check-0123456789abcdef
        run: python manage.py check --deploy --fail-level WARNING

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Production image builds
        run: docker build --target prod -t batas:ci .
