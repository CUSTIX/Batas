# Render Blueprint: one free web service (Docker), database on Neon (free, with pgvector).
# Secrets are set in the Render dashboard, never here: DATABASE_URL (sync: false) and, optionally,
# GEMINI_API_KEY. See docs/deploy.md.
services:
  - type: web
    name: batas-ph
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /livez/
    autoDeployTrigger: checksPass   # deploy only after GitHub Actions passes
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_HTTPS
        value: "true"
      - key: DJANGO_STATIC_MANIFEST
        value: "true"
      - key: CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
      - key: QUESTIONS_PER_HOUR
        value: "30"
